<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | AI WhatsApp Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(31, 35, 41, 0.08);
            border: 1px solid #e3e8f3;
        }
        .btn-primary {
            background-color: #0040c5;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0039b3;
            transform: translateY(-1px);
        }
        .input-field {
            border: 1px solid #c3c5d8;
            border-radius: 0.75rem;
            transition: all 0.2s ease;
        }
        .input-field:focus {
            border-color: #0040c5;
            ring: 2px solid #b6c4ff;
            outline: none;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="login-card w-full max-w-[400px] p-8 fade-in">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-[#1456f5] rounded-2xl flex items-center justify-center text-white mb-4 shadow-lg shadow-blue-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <h1 class="text-[24px] font-semibold text-[#161c23] tracking-tight">Admin Portal</h1>
            <p class="text-[14px] text-[#434656] mt-1">Silakan masuk untuk mengelola bot</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-[14px] font-medium text-[#434656] mb-1.5 ml-1">Username</label>
                <input type="text" name="username" required 
                    class="input-field w-full px-4 py-3 text-[15px] text-[#161c23] bg-white focus:ring-4 focus:ring-blue-50"
                    placeholder="Masukkan username">
            </div>
            <div>
                <label class="block text-[14px] font-medium text-[#434656] mb-1.5 ml-1">Password</label>
                <input type="password" name="password" required 
                    class="input-field w-full px-4 py-3 text-[15px] text-[#161c23] bg-white focus:ring-4 focus:ring-blue-50"
                    placeholder="••••••••">
            </div>
            
            <button type="submit" 
                class="btn-primary w-full py-3.5 text-white font-semibold rounded-xl text-[16px] shadow-md shadow-blue-100 mt-2">
                Masuk ke Dashboard
            </button>

            <div id="errorMsg" class="hidden text-center text-red-600 text-[13px] bg-red-50 py-2 rounded-lg border border-red-100">
                Username atau password tidak valid
            </div>
        </form>

        <div class="mt-8 pt-6 border-t border-[#eef4fe] text-center">
            <p class="text-[12px] text-[#737687]">© 2026 AI WhatsApp Bot · Secure Access</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            const errorMsg = document.getElementById('errorMsg');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerHTML = 'Memproses...';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.classList.remove('hidden');
                    btn.disabled = false;
                    btn.innerHTML = 'Masuk ke Dashboard';
                }
            } catch (err) {
                console.error('Login error:', err);
                alert('Kesalahan koneksi server');
                btn.disabled = false;
                btn.innerHTML = 'Masuk ke Dashboard';
            }
        });
    </script>
</body>
</html>
