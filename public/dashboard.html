<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  body { font-family: 'Inter', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: #c3c5d8; border-radius: 10px; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #737687; }
  .chat-input textarea { field-sizing: content; min-height: 40px; max-height: 120px; }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body class="bg-background text-on-surface h-screen overflow-hidden flex">

<!-- Navigasi Kiri (Sidebar Paling Kiri) -->
<nav class="fixed left-0 top-0 h-full flex flex-col items-center py-4 z-50 bg-surface-container-lowest border-r border-outline-variant w-[56px]">
  <div class="mb-8">
    <div class="w-9 h-9 rounded-xl bg-[#1456f5] flex items-center justify-center text-white font-bold text-xs shadow-lg">AI</div>
  </div>
  <div class="flex flex-col gap-4">
    <button class="flex items-center justify-center text-on-surface-variant w-10 h-10 hover:bg-surface-container-high transition-colors rounded-xl">
      <span class="material-symbols-outlined">grid_view</span>
    </button>
    <button class="flex items-center justify-center bg-[#1456f5] text-white rounded-full w-10 h-10 shadow-md">
      <span class="material-symbols-outlined fill">chat_bubble</span>
    </button>
    <button class="flex items-center justify-center text-on-surface-variant w-10 h-10 hover:bg-surface-container-high transition-colors rounded-xl">
      <span class="material-symbols-outlined">confirmation_number</span>
    </button>
    <button class="flex items-center justify-center text-on-surface-variant w-10 h-10 hover:bg-surface-container-high transition-colors rounded-xl">
      <span class="material-symbols-outlined">analytics</span>
    </button>
  </div>
  <div class="mt-auto flex flex-col gap-4">
    <button class="flex items-center justify-center text-on-surface-variant w-10 h-10 hover:bg-surface-container-high transition-colors rounded-xl">
      <span class="material-symbols-outlined">settings</span>
    </button>
    <a href="/auth/logout" class="flex items-center justify-center text-error w-10 h-10 hover:bg-error-container transition-colors rounded-xl">  
      <span class="material-symbols-outlined">logout</span>
    </a>
  </div>
</nav>

<!-- Main Wrapper -->
<div class="flex-1 flex ml-[56px] h-full overflow-hidden">

  <!-- Sidebar Daftar Percakapan (Kolom Tengah) -->
  <aside class="w-[360px] bg-white border-r border-outline-variant flex flex-col h-full flex-shrink-0">
    <div class="p-md border-b border-outline-variant">
      <div class="flex items-center justify-between mb-md">
        <h2 class="text-[20px] font-bold text-on-surface">Percakapan</h2>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-success animate-pulse" id="statusDot"></span>
          <span class="text-[12px] font-medium text-success" id="statusText">Terhubung</span>
        </div>
      </div>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
        <input class="w-full bg-[#f0f2f5] border-none rounded-xl pl-[36px] pr-sm py-2.5 text-body-md focus:ring-2 focus:ring-primary transition-all outline-none" placeholder="Cari percakapan..." type="text" id="searchConvo" oninput="filterConversations()">
      </div>
      <div class="flex gap-lg mt-md">
        <button class="text-primary font-bold border-b-2 border-primary pb-2 text-[14px]" data-filter="all" onclick="setActiveFilter('all', this)">Semua</button>
        <button class="text-on-surface-variant pb-2 text-[14px] hover:text-primary transition-colors" data-filter="escalated" onclick="setActiveFilter('escalated', this)">Eskalasi</button>
        <button class="text-on-surface-variant pb-2 text-[14px] hover:text-primary transition-colors" data-filter="done" onclick="setActiveFilter('done', this)">Selesai</button>
      </div>
    </div>

    <!-- Container List Percakapan -->
    <div class="flex-1 overflow-y-auto scrollbar-thin" id="conversationList">
      <div class="p-10 text-center opacity-30 text-[13px]">Memuat...</div>
    </div>

    <!-- Statistik di Bawah Sidebar -->
    <div class="p-md border-t border-outline-variant bg-white text-[13px]">
      <div class="flex items-center justify-between text-on-surface-variant mb-1">
        <span>Total Percakapan</span>
        <span class="font-bold text-on-surface text-[14px]" id="statTotal">0</span>
      </div>
      <div class="flex items-center justify-between text-on-surface-variant mb-1">
        <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-warning"></span> Eskalasi</span>
        <span class="font-bold text-on-surface" id="statEsc">0</span>
      </div>
      <div class="flex items-center justify-between text-on-surface-variant">
        <span class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-success"></span> Selesai</span>
        <span class="font-bold text-on-surface" id="statDone">0</span>
      </div>
    </div>
  </aside>

  <!-- Panel Chat Utama (Kolom Kanan) -->
  <main class="flex-1 flex flex-col h-full bg-[#f8f9ff]">
    <!-- Header Panel Chat -->
    <header class="flex justify-between items-center w-full px-lg py-md bg-white border-b border-outline-variant flex-shrink-0 z-10">
      <div class="flex items-center gap-md" id="chatHeaderInfo">
        <div class="w-10 h-10 rounded-xl bg-[#e9eef9] flex items-center justify-center text-on-surface font-bold text-[14px] shadow-sm" id="chatAvatar">?</div>  
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 class="text-[16px] font-bold text-on-surface truncate" id="chatName">Pilih Percakapan</h1>
            <span id="headerStatusChip" class="hidden"></span>
          </div>
          <p class="text-[12px] text-on-surface-variant truncate" id="chatStatusMeta">Pilih chat di sebelah kiri</p>
        </div>
      </div>
      
      <div class="flex items-center gap-sm" id="actionButtons" style="display: none;">
        <!-- Area Sync -->
        <div class="flex items-center gap-1.5 mr-md">
          <input class="w-[180px] bg-[#f0f2f5] border border-outline-variant rounded-lg px-sm py-1.5 text-[13px] outline-none" type="text" id="serverInput" value="http://localhost:3000">
          <button class="px-3 py-1.5 bg-[#1456f5] text-white rounded-lg text-[13px] font-bold hover:opacity-90 flex items-center gap-1" onclick="connectWebSocket()">
            <span class="material-symbols-outlined text-[16px]">sync</span> Sync
          </button>
        </div>
        <!-- Tombol Aksi -->
        <button class="px-3 py-1.5 border border-outline-variant rounded-lg text-[13px] font-bold text-on-surface hover:bg-surface-container-high transition-all flex items-center gap-1.5 shadow-sm" onclick="updateConversationStatus('ai')">
          <span class="material-symbols-outlined text-[18px]">smart_toy</span> Ke AI
        </button>
        <button class="px-3 py-1.5 border border-outline-variant rounded-lg text-[13px] font-bold text-on-surface hover:bg-surface-container-high transition-all flex items-center gap-1.5 shadow-sm" onclick="updateConversationStatus('escalated')">
          <span class="material-symbols-outlined text-[18px]">escalator_warning</span> Eskalasi
        </button>
        <button class="px-4 py-1.5 bg-[#1456f5] rounded-lg text-[13px] font-bold text-white hover:opacity-90 shadow-sm flex items-center gap-1.5" onclick="updateConversationStatus('done')">
          <span class="material-symbols-outlined text-[18px]">check_circle</span> Selesaikan
        </button>
      </div>
    </header>

    <!-- Area Riwayat Pesan -->
    <div class="flex-1 overflow-y-auto p-lg flex flex-col gap-6 scrollbar-thin" id="chatMessagesArea">
      <div class="flex-1 flex flex-col items-center justify-center text-on-surface-variant gap-4 opacity-50 py-20" id="emptyChatState">
        <div class="w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-sm border border-outline-variant">
          <span class="material-symbols-outlined text-[48px] text-[#1456f5] fill">forum</span>
        </div>
        <h2 class="text-[20px] font-bold text-on-surface">Pilih Percakapan</h2>
        <p class="text-[14px]">Klik chat untuk mulai membalas.</p>
      </div>
    </div>

    <!-- Area Input Balasan -->
    <div class="p-lg bg-white border-t border-outline-variant flex-shrink-0">
      <div class="relative bg-white border border-outline-variant rounded-xl p-3 shadow-sm focus-within:ring-2 focus-within:ring-[#1456f5]/20 focus-within:border-[#1456f5] transition-all">
        <textarea class="w-full bg-transparent border-none focus:ring-0 resize-none text-[14px] p-0 outline-none max-h-[100px] mb-8" id="staffReplyInput" placeholder="Ketik balasan..." rows="1" onkeydown="handleReplyKeydown(event)" disabled></textarea>
        
        <div class="absolute bottom-2 left-3 flex items-center gap-2 opacity-50">
          <span class="material-symbols-outlined text-[14px]">keyboard</span>
          <span class="text-[11px] font-medium">Enter untuk kirim, Shift+Enter untuk baris baru</span>
        </div>

        <button class="absolute bottom-2 right-2 p-2.5 bg-[#1456f5] text-white rounded-xl hover:opacity-90 shadow-md disabled:opacity-30 disabled:shadow-none" id="sendButton" onclick="sendStaffReply()" disabled>
          <span class="material-symbols-outlined text-[20px]">send</span>
        </button>
      </div>
    </div>
  </main>

</div>

<!-- Global Toast -->
<div id="globalToast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-[#1f2329] text-white px-6 py-3 rounded-2xl text-[13px] font-bold shadow-2xl opacity-0 translate-y-4 transition-all duration-300 pointer-events-none z-[100]"></div>

<script>
let socket = null;
let conversationsMap = new Map();
let activePhoneKey = null;
let currentFilter = 'all';
let searchQuery = '';

function getApiBase() { return window.location.origin; }

function connectWebSocket() {
  if (socket) { try { socket.close(); } catch (e) {} }
  const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
  const wsUrl = wsProtocol + window.location.host;
  
  socket = new WebSocket(wsUrl);
  socket.onopen = function() {
    updateConnectionUI(true, 'Terhubung');
    showToast('Dashboard terhubung');
  };
  socket.onclose = function() {
    updateConnectionUI(false, 'Terputus');
    setTimeout(connectWebSocket, 4000);
  };
  socket.onmessage = function(ev) {
    let packet = JSON.parse(ev.data);
    handleSocketMessage(packet.event, packet.data);
  };
}

function updateConnectionUI(online, label) {
  let dot = document.getElementById('statusDot');
  let txt = document.getElementById('statusText');
  if (online) {
    if(dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-success animate-pulse';
    if(txt) txt.textContent = label;
  } else {
    if(dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-error';
    if(txt) txt.textContent = label;
  }
}

function handleSocketMessage(event, data) {
  if (event === 'init') {
    conversationsMap.clear();
    data.forEach(function(c) { conversationsMap.set(c.phone, c); });
    renderConversationList();
    updateStatsUI();
  } else if (event === 'message') {
    if (!conversationsMap.has(data.phone)) {
      conversationsMap.set(data.phone, { phone: data.phone, name: data.name || data.phone, status: 'ai', messages: [], updatedAt: Date.now() });
    }
    let conv = conversationsMap.get(data.phone);
    conv.messages.push({ from: data.from, text: data.text, time: data.time });
    conv.updatedAt = data.time || Date.now();
    renderConversationList();
    updateStatsUI();
    if (activePhoneKey === data.phone) renderChatMessages();
    else if (data.from === 'user') showToast('Pesan baru dari ' + (conv.name || data.phone));
  } else if (event === 'status_change') {
    let conv = conversationsMap.get(data.phone);
    if (conv) {
      conv.status = data.status;
      renderConversationList();
      updateStatsUI();
      if (activePhoneKey === data.phone) renderChatHeader();
    }
  }
}

function renderConversationList() {
  const container = document.getElementById('conversationList');
  const convArray = Array.from(conversationsMap.values()).sort((a,b) => b.updatedAt - a.updatedAt);
  const filtered = convArray.filter(c => {
    if (currentFilter !== 'all' && c.status !== currentFilter) return false;
    if (searchQuery) {
      const lastMsg = c.messages.length ? c.messages[c.messages.length-1].text : '';
      return (c.name + c.phone + lastMsg).toLowerCase().includes(searchQuery);
    }
    return true;
  });

  if (!filtered.length) {
    container.innerHTML = '<div class="p-10 text-center opacity-30 text-[13px]">Tidak ada chat</div>';
    return;
  }

  container.innerHTML = filtered.map(c => {
    const active = activePhoneKey === c.phone;
    const initial = (c.name||c.phone).slice(0,2).toUpperCase();
    const lastMsg = c.messages.length ? c.messages[c.messages.length-1].text : 'Percakapan baru';
    return `
      <div onclick="selectConversation('${c.phone}')" class="flex items-center gap-3 px-md py-4 cursor-pointer transition-all ${active ? 'bg-[#e9eef9] border-l-4 border-[#1456f5]' : 'hover:bg-[#f8f9ff] border-l-4 border-transparent'}">
        <div class="w-10 h-10 rounded-xl bg-white border border-outline-variant flex-shrink-0 flex items-center justify-center text-on-surface font-bold text-[14px] shadow-sm">${initial}</div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-baseline mb-0.5">
            <h4 class="font-bold text-[14px] truncate">${escapeHtml(c.name || c.phone)}</h4>
            <span class="text-[10px] text-on-surface-variant">${formatTime(c.updatedAt)}</span>
          </div>
          <p class="text-[12px] text-on-surface-variant truncate opacity-80">${escapeHtml(lastMsg)}</p>
          <div class="mt-1 flex items-center justify-between">
            ${statusChipSmall(c.status)}
            <span class="text-[10px] text-on-surface-variant opacity-60">${c.messages.length} pesan</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function statusChipSmall(s) {
  const colors = s === 'escalated' ? 'bg-[#ffdad6] text-[#ba1a1a]' : (s === 'done' ? 'bg-[#d4edda] text-[#155724]' : 'bg-[#dce1ff] text-[#001550]');
  const label = s === 'escalated' ? 'Eskalasi' : (s === 'done' ? 'Selesai' : 'AI');
  return `<span class="px-2 py-0.5 ${colors} rounded-md text-[9px] font-bold uppercase tracking-wider">${label}</span>`;
}

function selectConversation(phone) {
  activePhoneKey = phone;
  renderConversationList();
  renderChatHeader();
  renderChatMessages();
  document.getElementById('staffReplyInput').disabled = false;
  document.getElementById('sendButton').disabled = false;
  document.getElementById('actionButtons').style.display = 'flex';
  document.getElementById('emptyChatState').style.display = 'none';
}

function renderChatHeader() {
  const c = conversationsMap.get(activePhoneKey);
  if (!c) return;
  document.getElementById('chatAvatar').textContent = (c.name||'U').slice(0,2).toUpperCase();
  document.getElementById('chatName').innerHTML = escapeHtml(c.name || c.phone);
  document.getElementById('chatStatusMeta').textContent = c.phone + ' · Percakapan Aktif';
  
  const chip = document.getElementById('headerStatusChip');
  chip.className = 'px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider inline-flex ' + (c.status === 'escalated' ? 'bg-[#ffdad6] text-[#ba1a1a]' : (c.status === 'done' ? 'bg-[#d4edda] text-[#155724]' : (c.status === 'ai' ? 'bg-[#dce1ff] text-[#001550]' : 'bg-surface-container')));
  chip.textContent = c.status === 'escalated' ? 'Eskalasi' : (c.status === 'done' ? 'Selesai' : 'AI');
  chip.classList.remove('hidden');
}

function renderChatMessages() {
  const c = conversationsMap.get(activePhoneKey);
  const area = document.getElementById('chatMessagesArea');
  if (!c || !c.messages.length) {
    area.innerHTML = '<div class="py-20 text-center opacity-30 text-[13px]">Belum ada pesan</div>';
    return;
  }
  area.innerHTML = c.messages.map(m => {
    const isRight = m.from === 'staff' || m.from === 'ai';
    return `
      <div class="flex gap-md max-w-[75%] fade-in ${isRight ? 'self-end flex-row-reverse' : ''}">
        <div class="w-8 h-8 rounded-full flex-shrink-0 mt-1 flex items-center justify-center ${m.from === 'ai' ? 'bg-[#1456f5]' : (m.from === 'staff' ? 'bg-[#191c1e]' : 'bg-[#dde3ed]')} text-white shadow-sm font-bold text-[10px]">
          ${m.from === 'ai' ? '<span class="material-symbols-outlined text-[16px]">smart_toy</span>' : (m.from === 'staff' ? '<span class="material-symbols-outlined text-[16px]">support_agent</span>' : (c.name||'U').slice(0,2).toUpperCase())}
        </div>
        <div>
          <div class="text-[10px] text-on-surface-variant mb-1 ${isRight ? 'text-right mr-1' : 'ml-1'} flex items-center gap-1 ${isRight ? 'flex-row-reverse' : ''}">
            <span class="font-bold uppercase">${m.from === 'ai' ? '🤖 Bot AI' : (m.from === 'staff' ? '👨‍💻 Admin' : escapeHtml(c.name || 'User'))}</span>
            <span>&middot; ${new Date(m.time).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</span>
          </div>
          <div class="p-4 rounded-2xl shadow-sm text-[14px] leading-relaxed ${isRight ? 'bg-[#1456f5] text-white rounded-tr-none' : 'bg-white text-on-surface border border-outline-variant rounded-tl-none'}">
            ${escapeHtml(m.text).replace(/\n/g, '<br>')}
          </div>
        </div>
      </div>
    `;
  }).join('');
  area.scrollTop = area.scrollHeight;
}

function sendStaffReply() {
  const input = document.getElementById('staffReplyInput');
  const text = input.value.trim();
  if (!text || !activePhoneKey) return;
  input.value = '';
  fetch(getApiBase() + '/api/conversations/' + activePhoneKey + '/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  }).catch(() => showToast('Gagal mengirim'));
}

function updateConversationStatus(status) {
  if (!activePhoneKey) return;
  fetch(getApiBase() + '/api/conversations/' + activePhoneKey + '/status', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  }).then(() => showToast('Status diperbarui')).catch(() => showToast('Gagal update'));
}

function setActiveFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('[data-filter]').forEach(b => b.className = 'text-on-surface-variant pb-2 text-[14px] hover:text-primary transition-colors');
  el.className = 'text-primary font-bold border-b-2 border-primary pb-2 text-[14px]';
  renderConversationList();
}
function filterConversations() { searchQuery = document.getElementById('searchConvo').value.trim().toLowerCase(); renderConversationList(); }
function updateStatsUI() {
  const all = Array.from(conversationsMap.values());
  document.getElementById('statTotal').textContent = all.length;
  document.getElementById('statEsc').textContent = all.filter(c => c.status === 'escalated').length;
  document.getElementById('statDone').textContent = all.filter(c => c.status === 'done').length;
}
function showToast(m) {
  const t = document.getElementById('globalToast');
  t.textContent = m;
  t.classList.add('opacity-100', 'translate-y-4');
  setTimeout(() => t.classList.remove('opacity-100', 'translate-y-4'), 3000);
}
function handleReplyKeydown(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendStaffReply(); } }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}
connectWebSocket();
</script>
