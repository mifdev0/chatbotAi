<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT Helpdesk — Dashboard Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F4F2EE;
  --surface: #FAFAF8;
  --surface2: #EFEDE8;
  --border: #E0DDD6;
  --border2: #C8C5BC;
  --text: #1A1916;
  --text2: #6B6860;
  --text3: #A09D97;
  --blue: #1A56E8;
  --blue-light: #EBF0FD;
  --blue-mid: #B8C9F8;
  --amber: #C46A00;
  --amber-light: #FEF3E2;
  --green: #1A7A4A;
  --green-light: #E6F5EC;
  --red: #CC2B2B;
  --red-light: #FDEAEA;
  --font: 'DM Sans', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topnav {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
}

.logo {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue);
}

.nav-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 500;
  background: var(--green-light);
  color: var(--green);
  border: 1px solid #A8DFBF;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

.status-pill.offline {
  background: var(--red-light);
  color: var(--red);
  border-color: #F5BABA;
}

.status-pill.offline .status-dot {
  background: var(--red);
  animation: none;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.avatar-nav {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--text);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
}

.config-bar {
  background: var(--amber-light);
  border-bottom: 1px solid #F5D4A0;
  padding: 8px 20px;
  font-size: 12px;
  color: var(--amber);
  display: flex;
  align-items: center;
  gap: 10px;
}

.config-input {
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid #F5D4A0;
  background: #fff;
  font-size: 12px;
  color: var(--text);
  outline: none;
  width: 260px;
  font-family: var(--font);
}

.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  flex: 1;
  overflow: hidden;
}

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.sidebar-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 10px;
}

.filter-row {
  display: flex;
  gap: 4px;
}

.filter-btn {
  flex: 1;
  padding: 5px 8px;
  border-radius: var(--radius-sm);
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text2);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
  font-family: var(--font);
}

.filter-btn:hover {
  border-color: var(--border2);
  color: var(--text);
}

.filter-btn.active {
  background: var(--text);
  color: #fff;
  border-color: var(--text);
}

.convo-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.convo-list::-webkit-scrollbar { width: 3px; }
.convo-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.convo-item {
  padding: 11px 12px;
  border-radius: var(--radius);
  cursor: pointer;
  margin-bottom: 3px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: background 0.12s;
  border: 1px solid transparent;
}

.convo-item:hover { background: var(--surface2); }
.convo-item.active { background: var(--blue-light); border-color: var(--blue-mid); }
.convo-item.escalated { border-color: #F5D4A0; }

.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
  background: var(--blue-light);
  color: var(--blue);
}

.convo-body { flex: 1; min-width: 0; }

.convo-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}

.convo-name { font-size: 13px; font-weight: 600; color: var(--text); }
.convo-time { font-size: 10px; color: var(--text3); }
.convo-preview { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 10px;
  font-weight: 600;
}

.badge-amber { background: var(--amber-light); color: var(--amber); }
.badge-green { background: var(--green-light); color: var(--green); }
.badge-blue { background: var(--blue-light); color: var(--blue); }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}

.metric-mini {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.metric-mini-item { text-align: center; }
.metric-mini-val { font-size: 18px; font-weight: 600; color: var(--text); }
.metric-mini-lbl { font-size: 10px; color: var(--text3); margin-top: 1px; }

.main-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.chat-header {
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-header-info { flex: 1; }
.chat-header-name { font-size: 14px; font-weight: 600; color: var(--text); }
.chat-header-meta { font-size: 12px; color: var(--text2); margin-top: 1px; }
.chat-actions { display: flex; gap: 6px; }

.btn {
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  transition: all 0.12s;
  font-family: var(--font);
}

.btn:hover { border-color: var(--border2); }
.btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn-primary:hover { background: #1348CC; }
.btn-success { background: var(--green-light); color: var(--green); border-color: #A8DFBF; }
.btn-danger { background: var(--red-light); color: var(--red); border-color: #F5BABA; }

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.chat-messages::-webkit-scrollbar { width: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text3);
  gap: 8px;
}

.empty-state-icon { font-size: 40px; }
.empty-state-text { font-size: 14px; }

.msg-row { display: flex; gap: 8px; }
.msg-row.right { flex-direction: row-reverse; }
.msg-row.center { justify-content: center; }

.msg-av {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}

.msg-content { max-width: 72%; }
.msg-sender { font-size: 10px; color: var(--text3); margin-bottom: 3px; font-weight: 500; }
.msg-row.right .msg-sender { text-align: right; }

.bubble { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.55; }
.bubble-user { background: var(--surface2); color: var(--text); border-radius: 4px 12px 12px 12px; border: 1px solid var(--border); }
.bubble-ai { background: var(--blue); color: #fff; border-radius: 12px 4px 12px 12px; }
.bubble-staff { background: var(--text); color: #fff; border-radius: 12px 4px 12px 12px; }
.bubble-system { background: var(--amber-light); color: var(--amber); border-radius: 8px; font-size: 11px; padding: 6px 14px; font-weight: 500; }
.msg-time { font-size: 10px; color: var(--text3); margin-top: 3px; }

.typing-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 13px;
  border-radius: 12px 4px 12px 12px;
  background: var(--blue);
  width: fit-content;
}

.typing-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.6);
  animation: typing 1.4s infinite;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typing {
  0%, 60%, 100% {
    transform: translateY(0);
    opacity: 0.6;
  }
  30% {
    transform: translateY(-10px);
    opacity: 1;
  }
}

.chat-input-area {
  padding: 14px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

.chat-input {
  flex: 1;
  padding: 9px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg);
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  resize: none;
  outline: none;
  transition: border 0.12s;
  height: 38px;
}

.chat-input:focus { border-color: var(--blue); }

.send-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius);
  background: var(--blue);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s;
}

.send-btn:hover { background: #1348CC; }
.send-btn svg { width: 16px; height: 16px; fill: #fff; }

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: #fff;
  padding: 10px 18px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s;
  z-index: 999;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="topnav">
  <div class="logo">
    <div class="logo-dot"></div>
    IT Helpdesk Admin
  </div>
  <div class="nav-right">
    <div class="status-pill offline" id="ws-status">
      <div class="status-dot"></div>
      <span id="ws-status-text">Terputus</span>
    </div>
    <div class="avatar-nav">AD</div>
  </div>
</div>

<div class="config-bar" id="config-bar">
  ⚙️ Server URL:
  <input class="config-input" id="server-url" value="http://localhost:3000" />
  <button class="btn btn-primary" style="padding:5px 12px;font-size:11px" onclick="connect()">Hubungkan</button>
</div>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Percakapan</div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="setFilter('all',this)">Semua</button>
        <button class="filter-btn" onclick="setFilter('escalated',this)">Eskalasi</button>
        <button class="filter-btn" onclick="setFilter('done',this)">Selesai</button>
      </div>
    </div>
    <div class="convo-list" id="convo-list">
      <div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">Belum terhubung ke server</div>
    </div>
    <div class="sidebar-footer">
      <div style="font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px">Statistik</div>
      <div class="metric-mini">
        <div class="metric-mini-item">
          <div class="metric-mini-val" id="stat-total">0</div>
          <div class="metric-mini-lbl">Total</div>
        </div>
        <div class="metric-mini-item">
          <div class="metric-mini-val" id="stat-escalated" style="color:var(--amber)">0</div>
          <div class="metric-mini-lbl">Eskalasi</div>
        </div>
        <div class="metric-mini-item">
          <div class="metric-mini-val" id="stat-done" style="color:var(--green)">0</div>
          <div class="metric-mini-lbl">Selesai</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-panel">
    <div class="chat-header">
      <div class="avatar" id="chat-av">?</div>
      <div class="chat-header-info">
        <div class="chat-header-name" id="chat-name">Pilih percakapan</div>
        <div class="chat-header-meta" id="chat-meta">—</div>
      </div>
      <div class="chat-actions" id="chat-actions" style="display:none">
        <button class="btn btn-success" onclick="updateStatus('done')">✓ Selesaikan</button>
        <button class="btn btn-danger" onclick="updateStatus('escalated')">⚡ Eskalasi</button>
        <button class="btn" onclick="updateStatus('ai')">🤖 Ke AI</button>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <div class="empty-state-text">Pilih percakapan untuk mulai</div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea class="chat-input" id="staff-input" placeholder="Balas sebagai staf IT..." onkeydown="handleEnter(event)" disabled></textarea>
      <button class="send-btn" onclick="sendReply()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API = function() { return document.getElementById('server-url').value.trim().replace(/\/$/, ''); };
var ws = null;
var convos = {};
var activePhone = null;
var activeFilter = 'all';

function connect() {
  var base = API();
  var wsUrl = base.replace('https://', 'wss://').replace('http://', 'ws://');
  if (ws) { try { ws.close(); } catch(e) {} }
  ws = new WebSocket(wsUrl);

  ws.onopen = function() {
    setStatus(true);
    document.getElementById('config-bar').style.display = 'none';
    showToast('Terhubung ke server');
  };

  ws.onclose = function() {
    setStatus(false);
    setTimeout(connect, 3000);
  };

  ws.onerror = function() {
    setStatus(false);
  };

  ws.onmessage = function(e) {
    var msg = JSON.parse(e.data);
    var event = msg.event;
    var data = msg.data;

    if (event === 'init') {
      convos = {};
      for (var i = 0; i < data.length; i++) {
        convos[data[i].phone] = data[i];
      }
      renderList();
      updateStats();
    }

    if (event === 'message') {
      var phone = data.phone;
      if (!convos[phone]) {
        convos[phone] = { phone: phone, name: data.name || phone, status: 'ai', messages: [], createdAt: data.time, updatedAt: data.time };
      }
      
      // Show typing indicator if message is from user and active conversation
      if (data.from === 'user' && activePhone === phone) {
        showTypingIndicator();
      }
      
      convos[phone].messages.push({ from: data.from, text: data.text, time: data.time });
      convos[phone].updatedAt = data.time;
      renderList();
      updateStats();
      if (activePhone === phone) {
        // Hide typing indicator when AI responds
        if (data.from === 'ai' || data.from === 'staff') {
          hideTypingIndicator();
        }
        renderMessages();
      } else if (data.from === 'user') {
        showToast('Pesan baru dari ' + (convos[phone].name || phone));
      }
    }

    if (event === 'status_change') {
      var phone = data.phone;
      if (convos[phone]) {
        convos[phone].status = data.status;
        renderList();
        updateStats();
        if (activePhone === phone) renderHeader();
      }
    }
  };
}

function setStatus(online) {
  var pill = document.getElementById('ws-status');
  pill.className = online ? 'status-pill' : 'status-pill offline';
  document.getElementById('ws-status-text').textContent = online ? 'Terhubung' : 'Terputus';
}

function renderList() {
  var list = document.getElementById('convo-list');
  var items = Object.values(convos).sort(function(a, b) { return b.updatedAt - a.updatedAt; });

  if (activeFilter === 'escalated') items = items.filter(function(c) { return c.status === 'escalated'; });
  if (activeFilter === 'done') items = items.filter(function(c) { return c.status === 'done'; });

  if (!items.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text3);font-size:13px">Tidak ada percakapan</div>';
    return;
  }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    var c = items[i];
    var init = (c.name || '?').substring(0, 2).toUpperCase();
    var time = c.updatedAt ? new Date(c.updatedAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
    var lastMsg = c.messages && c.messages.length ? c.messages[c.messages.length - 1].text : '—';
    var preview = lastMsg.substring(0, 45);
    var bc = c.status === 'escalated' ? 'badge-amber' : c.status === 'done' ? 'badge-green' : 'badge-blue';
    var bt = c.status === 'escalated' ? 'Eskalasi' : c.status === 'done' ? 'Selesai' : 'AI';
    var ac = c.phone === activePhone ? ' active' : '';
    var ec = c.status === 'escalated' ? ' escalated' : '';
    html += '<div class="convo-item' + ac + ec + '" onclick="selectConvo(\'' + c.phone + '\')">';
    html += '<div class="avatar">' + init + '</div>';
    html += '<div class="convo-body">';
    html += '<div class="convo-top"><div class="convo-name">' + (c.name || c.phone) + '</div><div class="convo-time">' + time + '</div></div>';
    html += '<div class="convo-preview">' + preview + '</div>';
    html += '<span class="badge ' + bc + '">' + bt + '</span>';
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function updateStats() {
  var all = Object.values(convos);
  document.getElementById('stat-total').textContent = all.length;
  document.getElementById('stat-escalated').textContent = all.filter(function(c) { return c.status === 'escalated'; }).length;
  document.getElementById('stat-done').textContent = all.filter(function(c) { return c.status === 'done'; }).length;
}

function selectConvo(phone) {
  activePhone = phone;
  renderList();
  renderHeader();
  renderMessages();
  document.getElementById('staff-input').disabled = false;
  document.getElementById('chat-actions').style.display = 'flex';
}

function renderHeader() {
  var c = convos[activePhone];
  if (!c) return;
  document.getElementById('chat-av').textContent = (c.name || '?').substring(0, 2).toUpperCase();
  document.getElementById('chat-name').textContent = c.name || c.phone;
  var st = c.status === 'escalated' ? '⚡ Eskalasi' : c.status === 'done' ? '✓ Selesai' : '🤖 AI Handle';
  document.getElementById('chat-meta').textContent = c.phone + ' · ' + st;
}

function renderMessages() {
  var c = convos[activePhone];
  if (!c) return;
  var area = document.getElementById('chat-messages');

  if (!c.messages || !c.messages.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">💬</div><div class="empty-state-text">Belum ada pesan</div></div>';
    return;
  }

  var html = '';
  for (var i = 0; i < c.messages.length; i++) {
    var m = c.messages[i];
    var t = m.time ? new Date(m.time).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) : '';
    var txt = m.text.replace(/\n/g, '<br>');
    var init = (c.name || '?').substring(0, 2).toUpperCase();

    if (m.from === 'system') {
      html += '<div class="msg-row center"><div class="bubble bubble-system">⚡ ' + txt + '</div></div>';
    } else if (m.from === 'user') {
      html += '<div class="msg-row">';
      html += '<div class="msg-av" style="background:var(--blue-light);color:var(--blue)">' + init + '</div>';
      html += '<div class="msg-content"><div class="msg-sender">' + (c.name || c.phone) + '</div>';
      html += '<div class="bubble bubble-user">' + txt + '</div>';
      html += '<div class="msg-time">' + t + '</div></div></div>';
    } else if (m.from === 'ai') {
      html += '<div class="msg-row right">';
      html += '<div class="msg-content"><div class="msg-sender">AI Helpdesk</div>';
      html += '<div class="bubble bubble-ai">' + txt + '</div>';
      html += '<div class="msg-time">' + t + '</div></div>';
      html += '<div class="msg-av" style="background:var(--blue-light);color:var(--blue);font-size:8px">AI</div></div>';
    } else if (m.from === 'staff') {
      html += '<div class="msg-row right">';
      html += '<div class="msg-content"><div class="msg-sender">Staf IT</div>';
      html += '<div class="bubble bubble-staff">' + txt + '</div>';
      html += '<div class="msg-time">' + t + '</div></div>';
      html += '<div class="msg-av" style="background:var(--text);color:#fff;font-size:8px">ST</div></div>';
    }
  }
  area.innerHTML = html;
  area.scrollTop = area.scrollHeight;
}

function showTypingIndicator() {
  var area = document.getElementById('chat-messages');
  var typingHtml = '<div class="msg-row right" id="typing-indicator-row">';
  typingHtml += '<div class="msg-content">';
  typingHtml += '<div class="typing-indicator">';
  typingHtml += '<div class="typing-dot"></div>';
  typingHtml += '<div class="typing-dot"></div>';
  typingHtml += '<div class="typing-dot"></div>';
  typingHtml += '</div></div>';
  typingHtml += '<div class="msg-av" style="background:var(--blue-light);color:var(--blue);font-size:8px">AI</div></div>';
  area.innerHTML += typingHtml;
  area.scrollTop = area.scrollHeight;
}

function hideTypingIndicator() {
  var indicator = document.getElementById('typing-indicator-row');
  if (indicator) indicator.remove();
}

function sendReply() {
  var input = document.getElementById('staff-input');
  var text = input.value.trim();
  if (!text || !activePhone) return;
  input.value = '';
  input.style.height = 'auto';

  fetch(API() + '/api/conversations/' + activePhone + '/reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: text })
  }).then(function(res) {
    if (!res.ok) showToast('Gagal kirim pesan');
  }).catch(function() {
    showToast('Gagal kirim pesan');
  });
}

function handleEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendReply();
  }
}

function updateStatus(status) {
  if (!activePhone) return;
  fetch(API() + '/api/conversations/' + activePhone + '/status', {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: status })
  }).then(function() {
    var labels = { done: 'Ditandai selesai', escalated: 'Dieskalasi', ai: 'Dikembalikan ke AI' };
    showToast(labels[status] || 'Status diperbarui');
  }).catch(function() {
    showToast('Gagal update status');
  });
}

function setFilter(f, btn) {
  activeFilter = f;
  var btns = document.querySelectorAll('.filter-btn');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  renderList();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

window.addEventListener('load', function() { connect(); });
</script>
</body>
</html>
